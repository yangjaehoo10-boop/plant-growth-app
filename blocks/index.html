<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16323a">
<meta name="mobile-web-app-capable" content="yes">
<title>블록뜰</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16323a; overscroll-behavior: none;
    touch-action: none; user-select: none; -webkit-user-select: none; font-family: system-ui, "Noto Sans KR", sans-serif; color: #fff; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #cross { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; pointer-events: none !important;
    background: linear-gradient(#fff, #fff) center/2px 100% no-repeat, linear-gradient(#fff, #fff) center/100% 2px no-repeat;
    mix-blend-mode: difference; opacity: .85; }
  .touch #cross { display: none; }
  #hotbar { position: absolute; left: 50%; bottom: calc(8px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; gap: 4px; max-width: calc(100vw - 16px); overflow-x: auto; padding: 5px; border-radius: 12px;
    background: rgba(12, 24, 30, .55); scrollbar-width: none; }
  #hotbar::-webkit-scrollbar { display: none; }
  .slot { flex: 0 0 auto; width: 46px; height: 52px; padding: 4px 0 0; border: 2px solid transparent; border-radius: 9px;
    background: rgba(255, 255, 255, .08); color: #fff; font: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .slot i { width: 26px; height: 26px; border-radius: 5px; box-shadow: inset -3px -4px 0 rgba(0, 0, 0, .22), inset 2px 2px 0 rgba(255, 255, 255, .25); }
  .slot span { font-size: 10px; line-height: 1; white-space: nowrap; }
  .slot.on { border-color: #ffd866; background: rgba(255, 216, 102, .22); }
  .btn { position: absolute; width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .5);
    background: rgba(12, 24, 30, .45); color: #fff; font-size: 26px; display: none; align-items: center; justify-content: center; padding: 0; }
  .btn.down, .btn.on { background: rgba(255, 216, 102, .45); border-color: #ffd866; }
  .touch .btn { display: flex; }
  #jump { right: calc(22px + env(safe-area-inset-right)); bottom: calc(92px + env(safe-area-inset-bottom)); }
  #down { right: calc(96px + env(safe-area-inset-right)); bottom: calc(92px + env(safe-area-inset-bottom)); }
  #fly { right: calc(22px + env(safe-area-inset-right)); bottom: calc(166px + env(safe-area-inset-bottom)); width: 50px; height: 50px; font-size: 20px; }
  #menu { display: flex; left: calc(10px + env(safe-area-inset-left)); top: calc(10px + env(safe-area-inset-top)); width: 44px; height: 44px; font-size: 20px; border-radius: 12px; }
  #stick { position: absolute; left: calc(22px + env(safe-area-inset-left)); bottom: calc(86px + env(safe-area-inset-bottom));
    width: 132px; height: 132px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .4); background: rgba(12, 24, 30, .35); display: none; }
  .touch #stick { display: block; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: rgba(255, 255, 255, .6); pointer-events: none; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(10, 26, 32, .72); backdrop-filter: blur(3px); }
  #panel { width: min(420px, 100%); text-align: center; }
  h1 { margin: 0 0 4px; font-size: 44px; letter-spacing: 2px; color: #ffd866; text-shadow: 3px 3px 0 #1d5a4c; }
  #sub { margin: 0 0 18px; opacity: .85; font-size: 14px; }
  #help { margin: 0 0 20px; font-size: 13px; line-height: 1.7; opacity: .9; }
  #msg { color: #ff9c8a; font-size: 13px; min-height: 1em; margin: 0 0 8px; }
  #panel button { display: block; width: 100%; margin: 8px 0; padding: 14px; border: 0; border-radius: 12px; font: inherit; font-size: 17px; font-weight: 700; }
  #start { background: #ffd866; color: #1c2b22; }
  #start:disabled { opacity: .4; }
  #reset { background: rgba(255, 255, 255, .14); color: #fff; font-weight: 500 !important; font-size: 14px !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="cross"></div>
  <button id="menu" class="btn" aria-label="메뉴">☰</button>
  <div id="stick"><div id="knob"></div></div>
  <button id="fly" class="btn" aria-label="비행 모드">✈</button>
  <button id="down" class="btn" aria-label="내려가기">⤓</button>
  <button id="jump" class="btn" aria-label="점프">⤒</button>
  <div id="hotbar"></div>
</div>
<div id="overlay">
  <div id="panel">
    <h1>블록뜰</h1>
    <p id="sub">끝없이 이어지는 땅에서 캐고, 쌓고, 가꾸세요</p>
    <p id="help"></p>
    <p id="msg"></p>
    <button id="start">시작하기</button>
    <button id="reset">새 월드 만들기</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
